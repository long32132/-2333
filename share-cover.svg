<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- 装饰圆环 -->
  <circle cx="300" cy="280" r="120" fill="none" stroke="rgba(245,158,11,0.15)" stroke-width="2"/>
  <circle cx="300" cy="280" r="90" fill="none" stroke="rgba(245,158,11,0.1)" stroke-width="1"/>

  <!-- 骰子 1 -->
  <g transform="translate(210,240)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
    <circle cx="35" cy="35" r="7" fill="#111827"/>
  </g>

  <!-- 骰子 2 -->
  <g transform="translate(320,240)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
    <circle cx="17" cy="17" r="7" fill="#111827"/>
    <circle cx="53" cy="53" r="7" fill="#111827"/>
  </g>

  <!-- 骰子 3 -->
  <g transform="translate(260,310) rotate(-15)">
    <rect x="0" y="0" width="70" height="70" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
    <circle cx="17" cy="17" r="7" fill="#111827"/>
    <circle cx="35" cy="35" r="7" fill="#111827"/>
    <circle cx="53" cy="53" r="7" fill="#111827"/>
  </g>

  <!-- 标题 -->
  <text x="300" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="52" font-weight="bold" fill="url(#gold)" filter="url(#glow)">大话骰子</text>
  <text x="300" y="185" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#fef3c7" opacity="0.8">对饮版</text>

  <!-- 副标题 -->
  <text x="300" y="470" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#cbd5e1">玩家 vs 电脑 · 1v1 吹牛拼酒</text>

  <!-- 底部装饰线 -->
  <line x1="150" y1="500" x2="450" y2="500" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>

  <!-- 🍺 图标 -->
  <text x="300" y="550" text-anchor="middle" font-size="32" fill="#fef3c7">🍺 叫骰 · 开盅 · 劈 · 反劈 🍺</text>
</svg>
